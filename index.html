<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoli Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0f1623;
    --surface2: #161e2e;
    --surface3: #1c2840;
    --border: rgba(99,179,237,0.12);
    --accent: #38bdf8;
    --accent2: #818cf8;
    --accent-glow: rgba(56,189,248,0.18);
    --text: #e2eaf7;
    --muted: #7a90b0;
    --danger: #f87171;
    --radius: 16px;
    --sidebar-w: 280px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ─── BACKGROUND FX ─── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 70% 10%, rgba(56,189,248,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 20% 80%, rgba(129,140,248,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ─── APP SHELL ─── */
  #app {
    position: relative; z-index: 1;
    width: 100%; height: 100dvh;
    display: flex;
    max-width: 1200px;
  }

  /* ════════════════════════════════
     LOGIN SCREEN
  ════════════════════════════════ */
  #loginScreen {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #loginScreen.hidden { display: none; }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(56,189,248,0.06);
    animation: slideUp 0.5s cubic-bezier(.16,1,.3,1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-logo {
    text-align: center;
    margin-bottom: 36px;
  }
  .login-logo .icon {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin-bottom: 14px;
    box-shadow: 0 8px 30px rgba(56,189,248,0.25);
  }
  .login-logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 800;
    background: linear-gradient(135deg, #e2eaf7, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .login-logo p {
    color: var(--muted); font-size: 13px; margin-top: 4px;
  }

  .field-group { margin-bottom: 14px; }
  .field-group label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .field-group input {
    width: 100%; padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text); font-family: inherit; font-size: 15px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .field-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .field-group input::placeholder { color: #3a4f6a; }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; }

  .btn {
    flex: 1; padding: 13px;
    border: none; border-radius: 12px;
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform .15s, box-shadow .2s, opacity .2s;
    letter-spacing: 0.3px;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    color: #fff;
    box-shadow: 0 4px 20px rgba(56,189,248,0.3);
  }
  .btn-primary:hover { box-shadow: 0 6px 28px rgba(56,189,248,0.45); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--surface3); }

  .error-msg {
    color: var(--danger); font-size: 12px;
    text-align: center; margin-top: 12px;
    min-height: 18px;
  }

  /* ════════════════════════════════
     CHAT SCREEN
  ════════════════════════════════ */
  #chatScreen {
    display: none;
    width: 100%; height: 100%;
    flex-direction: column;
  }
  #chatScreen.visible { display: flex; }

  /* ─── TOPBAR ─── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    height: 64px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .topbar-logo {
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, #e2eaf7, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-right: 4px;
  }
  .topbar-dot {
    width: 8px; height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 6px #22c55e;
    flex-shrink: 0;
  }
  .topbar-room {
    flex: 1; text-align: center;
  }
  .topbar-room span {
    font-size: 13px; color: var(--muted);
    font-weight: 500;
  }

  /* User badge */
  .user-badge {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 6px 14px 6px 8px;
    cursor: default;
  }
  .user-badge .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    color: #fff; text-transform: uppercase; flex-shrink: 0;
  }
  .user-badge .uname {
    font-size: 13px; font-weight: 500; color: var(--text);
    max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .btn-logout {
    padding: 7px 14px;
    background: transparent; border: 1px solid var(--border);
    border-radius: 10px; color: var(--muted);
    font-family: inherit; font-size: 12px; cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  /* ─── MESSAGES AREA ─── */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 24px 20px;
    display: flex; flex-direction: column; gap: 8px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .msg-item {
    display: flex; flex-direction: column;
    max-width: 75%;
    animation: msgIn 0.25s cubic-bezier(.16,1,.3,1);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-item.mine { align-self: flex-end; align-items: flex-end; }
  .msg-item.other { align-self: flex-start; align-items: flex-start; }

  .msg-meta {
    font-size: 11px; color: var(--muted);
    margin-bottom: 4px; padding: 0 4px;
    display: flex; gap: 6px; align-items: center;
  }
  .msg-meta .m-name {
    font-weight: 600; color: var(--accent);
    font-size: 12px;
  }
  .msg-item.mine .msg-meta { flex-direction: row-reverse; }
  .msg-item.mine .m-name { color: var(--accent2); }

  .msg-bubble {
    padding: 10px 16px;
    border-radius: 18px;
    font-size: 14.5px; line-height: 1.55;
    word-break: break-word;
  }
  .msg-item.other .msg-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
    color: var(--text);
  }
  .msg-item.mine .msg-bubble {
    background: linear-gradient(135deg, #0369a1, #0c4a6e);
    border: 1px solid rgba(56,189,248,0.2);
    border-bottom-right-radius: 6px;
    color: #e0f2fe;
  }

  /* empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); gap: 10px; padding-bottom: 60px;
  }
  .empty-state .big-icon { font-size: 42px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* ─── INPUT BAR ─── */
  .input-bar {
    padding: 14px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }

  #textInput {
    flex: 1; padding: 12px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 24px;
    color: var(--text); font-family: inherit; font-size: 15px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  #textInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  #textInput::placeholder { color: #3a4f6a; }

  .btn-send {
    width: 46px; height: 46px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    border: none; border-radius: 50%;
    color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s, box-shadow .2s;
    box-shadow: 0 4px 16px rgba(56,189,248,0.3);
  }
  .btn-send:hover { transform: scale(1.06); box-shadow: 0 6px 22px rgba(56,189,248,0.45); }
  .btn-send:active { transform: scale(0.94); }

  /* ════════════════════════════════
     MOBILE RESPONSIVE
  ════════════════════════════════ */
  @media (max-width: 600px) {
    .login-card { padding: 36px 24px; }
    .topbar { padding: 0 12px; gap: 8px; }
    .topbar-room { display: none; }
    .user-badge .uname { max-width: 70px; }
    .btn-logout { padding: 6px 10px; }
    .msg-item { max-width: 88%; }
    #messages { padding: 16px 12px; }
    .input-bar { padding: 10px 12px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ══ LOGIN ══ -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">💬</div>
        <h1>Memoli Chat</h1>
        <p>Gerçek zamanlı, güvenli mesajlaşma</p>
      </div>

      <div class="field-group">
        <label>Kullanıcı Adı</label>
        <input id="user" placeholder="adınızı girin" autocomplete="off">
      </div>
      <div class="field-group">
        <label>Şifre</label>
        <input id="pass" type="password" placeholder="••••••••">
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="btnRegister">Kayıt Ol</button>
        <button class="btn btn-primary" id="btnLogin">Giriş Yap</button>
      </div>
      <div class="error-msg" id="errMsg"></div>
    </div>
  </div>

  <!-- ══ CHAT ══ -->
  <div id="chatScreen">
    <!-- Topbar -->
    <div class="topbar">
      <span class="topbar-logo">Memoli</span>
      <div class="topbar-dot"></div>
      <div class="topbar-room"><span>🌐 Genel Oda</span></div>
      <div class="user-badge" id="userBadge">
        <div class="avatar" id="userAvatar">?</div>
        <span class="uname" id="userNameLabel">—</span>
      </div>
      <button class="btn-logout" id="btnLogout">Çıkış</button>
    </div>

    <!-- Messages -->
    <div id="messages">
      <div class="empty-state" id="emptyState">
        <div class="big-icon">💬</div>
        <p>Henüz mesaj yok. İlk mesajı sen gönder!</p>
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <input id="textInput" placeholder="Bir mesaj yaz…" autocomplete="off">
      <button class="btn-send" id="btnSend">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, push, onValue, set }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBb9Lf8tGXolG_lr6n69rd_6P4yj8kXBww",
  authDomain: "memolichat.firebaseapp.com",
  databaseURL: "https://memolichat-default-rtdb.firebasedatabase.app",
  projectId: "memolichat",
  storageBucket: "memolichat.firebasestorage.app",
  messagingSenderId: "887004520445",
  appId: "1:887004520445:web:99cab50491fe94ca170394"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);
let currentUser = "";

function showError(msg) {
  document.getElementById("errMsg").textContent = msg;
}

function setUserUI(name) {
  currentUser = name;
  document.getElementById("userNameLabel").textContent = name;
  document.getElementById("userAvatar").textContent = name.charAt(0).toUpperCase();
}

function enterChat() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("chatScreen").classList.add("visible");
  loadMessages();
  document.getElementById("textInput").focus();
}

async function register() {
  showError("");
  const name  = document.getElementById("user").value.trim();
  const email = name + "@chat.local";
  const pass  = document.getElementById("pass").value;
  if (!name || !pass) return showError("Kullanıcı adı ve şifre gerekli.");
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    showError("✅ Kayıt başarılı! Giriş yapabilirsiniz.");
  } catch(e) {
    showError(e.code === "auth/email-already-in-use" ? "Bu kullanıcı adı alınmış." : e.message);
  }
}

async function login() {
  showError("");
  const name  = document.getElementById("user").value.trim();
  const email = name + "@chat.local";
  const pass  = document.getElementById("pass").value;
  if (!name || !pass) return showError("Kullanıcı adı ve şifre gerekli.");
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    setUserUI(name);
    await set(ref(db, "users/" + name), { online: true });
    enterChat();
  } catch(e) {
    showError("Kullanıcı adı veya şifre hatalı.");
  }
}

async function logout() {
  if (currentUser) await set(ref(db, "users/" + currentUser), { online: false });
  await signOut(auth);
  currentUser = "";
  document.getElementById("chatScreen").classList.remove("visible");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("messages").innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="big-icon">💬</div>
      <p>Henüz mesaj yok. İlk mesajı sen gönder!</p>
    </div>`;
}

function formatTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
}

function loadMessages() {
  const msgRef = ref(db, "messages");
  onValue(msgRef, (snap) => {
    const box  = document.getElementById("messages");
    const data = snap.val();
    if (!data) return;

    document.getElementById("emptyState")?.remove();
    // only append new nodes rather than full redraw to preserve scroll position
    const existing = new Set([...box.querySelectorAll(".msg-item")].map(el => el.dataset.id));

    for (const id in data) {
      if (existing.has(id)) continue;
      const { user, text, ts } = data[id];
      const isMine = user === currentUser;

      const item = document.createElement("div");
      item.className = "msg-item " + (isMine ? "mine" : "other");
      item.dataset.id = id;
      item.innerHTML = `
        <div class="msg-meta">
          <span class="m-name">${isMine ? "Sen" : user}</span>
          <span>${formatTime(ts)}</span>
        </div>
        <div class="msg-bubble">${escapeHtml(text)}</div>`;
      box.appendChild(item);
    }
    box.scrollTop = box.scrollHeight;
  });
}

function send() {
  const inp  = document.getElementById("textInput");
  const text = inp.value.trim();
  if (!text || !currentUser) return;
  push(ref(db, "messages"), { text, user: currentUser, ts: Date.now() });
  inp.value = "";
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Wire up all event listeners (module-safe, no onclick attributes needed)
document.getElementById("btnRegister").addEventListener("click", register);
document.getElementById("btnLogin").addEventListener("click", login);
document.getElementById("btnLogout").addEventListener("click", logout);
document.getElementById("btnSend").addEventListener("click", send);
document.getElementById("textInput").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
