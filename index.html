<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Realtime Chat</title>

<style>
body{
    margin:0;
    background:#0f172a;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    width:400px;
    height:520px;
    background:#1e293b;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    padding:10px;
    background:#111827;
    text-align:center;
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.msg{
    background:#334155;
    padding:8px;
    margin:5px 0;
    border-radius:8px;
    word-wrap:break-word;
}

.input{
    display:flex;
}

input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
}

button{
    padding:12px;
    border:none;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
    <div class="header">💬 Realtime Chat</div>
    <div class="messages" id="messages"></div>

    <div class="input">
        <input id="text" placeholder="Mesaj yaz...">
        <button onclick="send()">Gönder</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔴 SENİN FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBb9Lf8tGXolG_lr6n69rd_6P4yj8kXBww",
  authDomain: "memolichat.firebaseapp.com",
  databaseURL: "https://memolichat-default-rtdb.firebaseio.com",
  projectId: "memolichat",
  storageBucket: "memolichat.firebasestorage.app",
  messagingSenderId: "887004520445",
  appId: "1:887004520445:web:99cab50491fe94ca170394"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const messagesRef = ref(db, "messages");

// REAL TIME LISTENER
onValue(messagesRef, (snapshot) => {
    const data = snapshot.val();
    const box = document.getElementById("messages");
    box.innerHTML = "";

    for (let id in data) {
        let div = document.createElement("div");
        div.className = "msg";
        div.innerText = data[id].text;
        box.appendChild(div);
    }

    box.scrollTop = box.scrollHeight;
});

// SEND MESSAGE
window.send = function () {
    let text = document.getElementById("text").value;
    if (!text) return;

    push(messagesRef, {
        text: text,
        time: Date.now()
    });

    document.getElementById("text").value = "";
}
</script>

</body>
</html>
